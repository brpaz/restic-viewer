[project]
site_url = "https://brpaz.github.io/restic-viewer/"
site_name = "Restic Viewer"
site_description = "Native GTK4/libadwaita app for browsing and restoring restic backup repositories."
site_author = "Bruno Paz"

copyright = "Copyright &copy; 2026 Bruno Paz"

repo_url = "https://github.com/brpaz/restic-viewer"
repo_name = "brpaz/restic-viewer"
edit_uri = "edit/main/docs/"

nav = [
  { "Get started" = "index.md" },
  { "Architecture decisions" = [
      { "Overview" = "adr/index.md" },
      { "0001 — Read-only browser scope" = "adr/0001-read-only-browser-scope.md" },
      { "0002 — Bundle restic in Flatpak" = "adr/0002-bundle-restic-in-flatpak.md" },
      { "0003 — Raw gtk4-rs over relm4" = "adr/0003-raw-gtk4-rs-over-relm4.md" },
      { "0004 — Portal file access over --filesystem=host" = "adr/0004-portal-file-access-over-filesystem-host.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/brpaz/restic-viewer"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.magiclink = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
