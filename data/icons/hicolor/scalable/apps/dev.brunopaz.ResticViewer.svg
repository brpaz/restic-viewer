<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17b2a0"/>
      <stop offset="1" stop-color="#3949c4"/>
    </linearGradient>
    <linearGradient id="sheen" x1="24" y1="18" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#sheen)"/>

  <!-- concentric rings: each backup is another layer around the last -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="12"/>
  <circle cx="64" cy="64" r="22" fill="none" stroke="#ffffff" stroke-width="13"/>
  <circle cx="64" cy="64" r="8" fill="#ffffff"/>
</svg>
