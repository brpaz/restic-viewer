name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what actually happened?
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How is Restic Viewer installed?
      options:
        - Flatpak (.flatpak bundle from a release)
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Shown on the About page (menu → About Restic Viewer → debug info)
      placeholder: e.g. v0.2.0, or a commit hash
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Repository Backend involved (if applicable)
      options:
        - Not applicable
        - Local
        - SFTP
        - S3-compatible
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Any error text shown in the app, or terminal output from `flatpak run --command=restic-viewer dev.brunopaz.ResticViewer`
      render: shell
    validations:
      required: false
