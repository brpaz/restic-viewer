name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Restic Viewer is deliberately scoped as a **Repository browser and restore tool**, not a backup manager — see [ADR-0001](https://github.com/brpaz/restic-viewer/blob/main/docs/adr/0001-read-only-browser-scope.md). Requests for running backups, scheduling, or `forget`/`prune` are out of scope by design.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that the app doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about, and why you didn't go with them
    validations:
      required: false
