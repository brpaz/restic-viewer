name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [released]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    # ubuntu-latest's own libadwaita-1-dev tops out at 1.5, but the app depends on
    # libadwaita's "v1_6" feature (Adw.Spinner) — Fedora tracks current GNOME closely
    # enough to satisfy it, and matches the Flatpak module's own GNOME Platform target.
    container: fedora:46
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config gtk4-devel libadwaita-devel libsecret-devel blueprint-compiler restic hostname

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  flatpak-sources-check:
    name: cargo-sources.json is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Regenerate and diff build-aux/cargo-sources.json
        run: |
          uv run build-aux/flatpak-cargo-generator.py Cargo.lock -o /tmp/cargo-sources-check.json
          diff -u build-aux/cargo-sources.json /tmp/cargo-sources-check.json || {
            echo "::error::build-aux/cargo-sources.json is stale — run 'task flatpak:sources' and commit the result"
            exit 1
          }

  flatpak-build:
    name: Flatpak build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write build-info.env
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$RELEASE_TAG"
          [ -n "$version" ] || version=$(git describe --tags --always --dirty)
          commit=$(git rev-parse --short HEAD)
          epoch=$(git log -1 --format=%ct)
          build_date=$(date -u -d "@$epoch" +%Y-%m-%d)
          {
            echo "VERSION=$version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } > build-info.env
          cat build-info.env

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: restic-viewer.flatpak
          manifest-path: dev.brunopaz.ResticViewer.json
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: restic-viewer-flatpak-bundle

  flatpak-asset:
    name: Attach Flatpak bundle to release
    needs: flatpak-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: restic-viewer-flatpak-bundle

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" restic-viewer.flatpak --repo "${{ github.repository }}"

  build-deb:
    name: Build .deb package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # Needs libadwaita >= 1.6 (see the "test" job above) — trixie is the only current
    # Debian release that ships it, and building there keeps the package's glibc/lib
    # requirements aligned with what current Debian/Ubuntu already provide.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq curl gcc pkg-config libgtk-4-dev libadwaita-1-dev libsecret-1-dev blueprint-compiler ca-certificates

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm

      - name: Build release binary
        env:
          LOCALEDIR: /usr/share/locale
        run: cargo build --release -p restic-viewer

      - name: Package .deb
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager deb --target restic-viewer.deb

      - uses: actions/upload-artifact@v7
        with:
          name: restic-viewer-deb
          path: restic-viewer.deb

  build-rpm:
    name: Build .rpm package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    container: fedora:46
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config gtk4-devel libadwaita-devel libsecret-devel blueprint-compiler curl

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm

      - name: Build release binary
        env:
          LOCALEDIR: /usr/share/locale
        run: cargo build --release -p restic-viewer

      - name: Package .rpm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager rpm --target restic-viewer.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: restic-viewer-rpm
          path: restic-viewer.rpm

  native-packages-asset:
    name: Attach .deb/.rpm packages to release
    needs: [build-deb, build-rpm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: restic-viewer-deb

      - uses: actions/download-artifact@v8
        with:
          name: restic-viewer-rpm

      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" restic-viewer.deb restic-viewer.rpm --repo "${{ github.repository }}"
