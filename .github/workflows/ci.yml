name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [released]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format, lint, audit, test
    runs-on: ubuntu-latest
    # ubuntu-latest's own libadwaita-1-dev tops out at 1.5, but the app depends on
    # libadwaita's "v1_6" feature (Adw.Spinner) — Fedora tracks current GNOME closely
    # enough to satisfy it, and matches the Flatpak module's own GNOME Platform target.
    container: fedora:46@sha256:78bb31de333664aa76c4bf54306791cd294c0bd4fbcfc4346e2286261de544c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          dnf install -y git gcc gcc-c++ make pkgconf-pkg-config gtk4-devel libadwaita-devel libsecret-devel blueprint-compiler restic hostname meson ninja-build desktop-file-utils appstream

      # Toolchain version/components come from rust-toolchain.toml, not a hardcoded
      # channel here — rustup reads it automatically on the first cargo/rustc
      # invocation below, so this stays in sync with local dev and devenv for free.
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Runs cargo test plus the desktop-file and metainfo validators.
      - name: meson test
        run: |
          meson setup _build --prefix=/usr
          meson test -C _build --print-errorlogs

  flatpak-sources-check:
    name: cargo-sources.json is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Regenerate and diff build-aux/cargo-sources.json
        run: |
          uv run build-aux/flatpak-cargo-generator.py Cargo.lock -o /tmp/cargo-sources-check.json
          diff -u build-aux/cargo-sources.json /tmp/cargo-sources-check.json || {
            echo "::error::build-aux/cargo-sources.json is stale — run 'task flatpak:sources' and commit the result"
            exit 1
          }

  flatpak-build:
    name: Flatpak build
    needs: [test, flatpak-sources-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      # The host paths are mounted so the first step can delete them: the SDK
      # runtime, extensions and cargo target do not fit in the runner's free disk.
      options: >-
        --privileged
        -v /usr/local/lib/android:/host/android
        -v /usr/share/dotnet:/host/dotnet
        -v /opt/ghc:/host/ghc
        -v /usr/share/swift:/host/swift
    steps:
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          rm -rf /host/android/* /host/dotnet/* /host/ghc/* /host/swift/* || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Write build-info.env
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$RELEASE_TAG"
          [ -n "$version" ] || version=$(git describe --tags --always --dirty)
          commit=$(git rev-parse --short HEAD)
          epoch=$(git log -1 --format=%ct)
          build_date=$(date -u -d "@$epoch" +%Y-%m-%d)
          {
            echo "VERSION=$version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } > build-info.env
          cat build-info.env
          echo "bundle=dev.brunopaz.ResticViewer-${version#v}-x86_64.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: ${{ steps.version.outputs.bundle }}
          manifest-path: dev.brunopaz.ResticViewer.json
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: restic-viewer-flatpak-bundle

      - name: Write checksum
        if: github.event_name == 'release'
        run: sha256sum "${{ steps.version.outputs.bundle }}" > "${{ steps.version.outputs.bundle }}.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: github.event_name == 'release'
        with:
          subject-path: ${{ steps.version.outputs.bundle }}

      - name: Upload bundle to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            ${{ steps.version.outputs.bundle }}
            ${{ steps.version.outputs.bundle }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build .deb package
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Needs libadwaita >= 1.6 (see the "test" job above) — trixie is the only current
    # Debian release that ships it, and building there keeps the package's glibc/lib
    # requirements aligned with what current Debian/Ubuntu already provide.
    container: debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq curl gcc pkg-config meson ninja-build libgtk-4-dev libadwaita-1-dev libsecret-1-dev blueprint-compiler ca-certificates

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: ./.github/actions/setup-nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr --buildtype=release
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .deb
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager deb --target .

      - name: Write checksum
        run: sha256sum *.deb > "$(echo *.deb).sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "*.deb"

      - name: Upload package to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            *.deb
            *.deb.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    name: Build .rpm package
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    container: fedora:46@sha256:78bb31de333664aa76c4bf54306791cd294c0bd4fbcfc4346e2286261de544c4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          dnf install -y gcc gcc-c++ make pkgconf-pkg-config gtk4-devel libadwaita-devel libsecret-devel blueprint-compiler meson ninja-build curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: ./.github/actions/setup-nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr --buildtype=release
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .rpm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager rpm --target .

      - name: Write checksum
        run: sha256sum *.rpm > "$(echo *.rpm).sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "*.rpm"

      - name: Upload package to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            *.rpm
            *.rpm.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
