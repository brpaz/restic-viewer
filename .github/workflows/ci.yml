name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [released]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev libsecret-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  flatpak-sources-check:
    name: cargo-sources.json is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Regenerate and diff build-aux/cargo-sources.json
        run: |
          uv run build-aux/flatpak-cargo-generator.py Cargo.lock -o /tmp/cargo-sources-check.json
          diff -u build-aux/cargo-sources.json /tmp/cargo-sources-check.json || {
            echo "::error::build-aux/cargo-sources.json is stale — run 'task flatpak:sources' and commit the result"
            exit 1
          }

  flatpak-build:
    name: Flatpak build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write build-info.env
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$RELEASE_TAG"
          [ -n "$version" ] || version=$(git describe --tags --always --dirty)
          commit=$(git rev-parse --short HEAD)
          epoch=$(git log -1 --format=%ct)
          build_date=$(date -u -d "@$epoch" +%Y-%m-%d)
          {
            echo "VERSION=$version"
            echo "COMMIT=$commit"
            echo "BUILD_DATE=$build_date"
          } > build-info.env
          cat build-info.env

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: restic-gtk.flatpak
          manifest-path: dev.brunopaz.ResticGtk.json
          cache-key: flatpak-builder-${{ github.sha }}
          artifact-name: restic-gtk-flatpak-bundle

  flatpak-asset:
    name: Attach Flatpak bundle to release
    needs: flatpak-build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: restic-gtk-flatpak-bundle

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" restic-gtk.flatpak --repo "${{ github.repository }}"
