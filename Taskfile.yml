version: "3"

vars:
  BUILD_DIR: _build
  INSTALL_DIR: _install
  MANIFEST: dev.brunopaz.ResticViewer.json
  APP_ID: dev.brunopaz.ResticViewer

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  setup:
    desc: Configure the Meson build directory
    status:
      - test -d {{.BUILD_DIR}}
    cmds:
      - meson setup {{.BUILD_DIR}} --prefix=/usr

  build:
    desc: Build the app in debug mode
    deps: [setup]
    cmds:
      - meson compile -C {{.BUILD_DIR}}

  build:release:
    desc: Build the app in release mode
    cmds:
      - meson setup --reconfigure {{.BUILD_DIR}}-release --prefix=/usr --buildtype=release
      - meson compile -C {{.BUILD_DIR}}-release

  run:
    desc: Run the app natively (not sandboxed)
    deps: [build]
    cmds:
      - "{{.BUILD_DIR}}/crates/app/restic-viewer"

  test:
    desc: Run the test suite and the desktop/metainfo validators
    deps: [setup]
    cmds:
      - meson test -C {{.BUILD_DIR}} --print-errorlogs

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt

  fmt:check:
    desc: Check formatting without modifying files (used in CI)
    cmds:
      - cargo fmt --check

  lint:
    desc: Run clippy, denying warnings (used in CI)
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  ci:
    desc: Run the same checks as the CI workflow
    cmds:
      - task: fmt:check
      - task: lint
      - task: test

  deny:
    desc: Check dependencies for advisories, licenses and banned sources
    cmds:
      - cargo deny check

  secrets:
    desc: Scan the repository history for leaked secrets
    cmds:
      - gitleaks git --redact --no-banner

  flatpak:sources:
    desc: Regenerate build-aux/cargo-sources.json from Cargo.lock
    cmds:
      - cargo generate-lockfile --offline || cargo generate-lockfile
      - uv run build-aux/flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json

  flatpak:sources:check:
    desc: Fail if build-aux/cargo-sources.json is stale relative to Cargo.lock (used in CI)
    cmds:
      - uv run build-aux/flatpak-cargo-generator.py Cargo.lock -o /tmp/cargo-sources-check.json
      - diff -q build-aux/cargo-sources.json /tmp/cargo-sources-check.json || (echo "build-aux/cargo-sources.json is stale — run 'task flatpak:sources' and commit the result" && exit 1)

  flatpak:build:
    desc: Build the Flatpak with flatpak-builder
    cmds:
      - flatpak-builder --force-clean --user --install-deps-from=flathub build-dir {{.MANIFEST}}

  flatpak:install:
    desc: Build and install the Flatpak locally
    cmds:
      - flatpak-builder --force-clean --user --install-deps-from=flathub --install build-dir {{.MANIFEST}}

  flatpak:run:
    desc: Run the installed Flatpak
    cmds:
      - flatpak run {{.APP_ID}}

  package:stage:
    internal: true
    cmds:
      - rm -rf {{.BUILD_DIR}}-release {{.INSTALL_DIR}}
      - meson setup {{.BUILD_DIR}}-release --prefix=/usr --buildtype=release
      - meson compile -C {{.BUILD_DIR}}-release
      - DESTDIR=$PWD/{{.INSTALL_DIR}} meson install -C {{.BUILD_DIR}}-release

  package:deb:
    desc: Build and package a .deb from a release build (requires nfpm on $PATH; run on a Debian/Ubuntu-family host with libadwaita >= 1.6)
    cmds:
      - task: package:stage
      - VERSION=$(git describe --tags --always | sed 's/^v//') nfpm package --config nfpm.yaml --packager deb --target .

  package:rpm:
    desc: Build and package a .rpm from a release build (requires nfpm on $PATH; run on a Fedora-family host)
    cmds:
      - task: package:stage
      - VERSION=$(git describe --tags --always | sed 's/^v//') nfpm package --config nfpm.yaml --packager rpm --target .

  hooks:install:
    desc: Install Git hooks (lefthook + commitlint-rs must be on $PATH)
    cmds:
      - lefthook install

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf target build-dir .flatpak-builder {{.BUILD_DIR}} {{.BUILD_DIR}}-release {{.INSTALL_DIR}}
