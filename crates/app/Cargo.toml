[package]
name = "restic-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "restic-gtk"
path = "src/main.rs"

[dependencies]
restic-client = { path = "../restic-client" }
gtk4 = { version = "0.11", package = "gtk4", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
libsecret = { version = "0.9", features = ["v0_21"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
