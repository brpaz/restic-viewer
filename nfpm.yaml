name: restic-viewer
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Bruno Paz
vendor: Bruno Paz
homepage: https://github.com/brpaz/restic-viewer
license: MIT
description: |
  Native GNOME (GTK4 + libadwaita) app for browsing and restoring restic backup
  repositories. Attaches to Repositories you already back up elsewhere and lets
  you browse their Snapshots and file trees, and restore what you need.

# Built from a `DESTDIR=... meson install` staging root (see Taskfile.yml and
# .github/workflows/ci.yml); `type: tree` copies the installed layout as-is.
contents:
  - src: ./_install/usr/bin
    dst: /usr/bin
    type: tree

  - src: ./_install/usr/share
    dst: /usr/share
    type: tree

# restic itself is a regular dependency here (unlike the Flatpak, which bundles
# its own build) — native packages should pull it from the distro like any
# other tool, not vendor it.
depends:
  - restic

overrides:
  deb:
    depends:
      - restic
      - libgtk-4-1
      - libadwaita-1-0
      - libsecret-1-0
  rpm:
    depends:
      - restic
      - gtk4
      - libadwaita
      - libsecret
