commit-msg:
  commands:
    "lint commit message":
      run: commitlint --edit {1}

pre-commit:
  commands:
    "cargo fmt":
      glob: "*.rs"
      run: cargo fmt --check
    "cargo clippy":
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings

pre-push:
  commands:
    "flatpak sources check":
      run: task flatpak:sources:check
